name: CI - Backend Services (Dev)
on:
  push:
    branches:
      - main
      - dev-test
  pull_request:
    branches:
      - main
      - dev-test

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      llm-api: ${{ steps.filter.outputs.llm-api }}
      mcp-tools: ${{ steps.filter.outputs.mcp-tools }}
      media-api: ${{ steps.filter.outputs.media-api }}
      response-api: ${{ steps.filter.outputs.response-api }}
      pkg: ${{ steps.filter.outputs.pkg }}
      go-common: ${{ steps.filter.outputs.go-common }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            llm-api:
              - 'services/llm-api/**'
            mcp-tools:
              - 'services/mcp-tools/**'
            media-api:
              - 'services/media-api/**'
            response-api:
              - 'services/response-api/**'
            pkg:
              - 'pkg/**'
            go-common:
              - 'packages/go-common/**'

  build-llm-api:
    needs: changes
    if: needs.changes.outputs.llm-api == 'true' || needs.changes.outputs.pkg == 'true' || needs.changes.outputs.go-common == 'true'
    uses: ./.github/workflows/_reusable-docker.yml
    secrets: inherit
    with:
      runs-on: ubuntu-24-04-docker
      docker-file: services/llm-api/Dockerfile
      context: services/llm-api
      registry-url: registry.menlo.ai
      tags: registry.menlo.ai/jan-server/llm-api:dev-${{ github.sha }}
      is_push: ${{ github.event_name == 'push' }}
      build-args: |
        VERSION_TAG=dev-${{ github.sha }}
      build-contexts: |
        go-common=packages/go-common

  build-mcp-tools:
    needs: changes
    if: needs.changes.outputs.mcp-tools == 'true' || needs.changes.outputs.pkg == 'true' || needs.changes.outputs.go-common == 'true'
    uses: ./.github/workflows/_reusable-docker.yml
    secrets: inherit
    with:
      runs-on: ubuntu-24-04-docker
      docker-file: services/mcp-tools/Dockerfile
      context: services/mcp-tools
      registry-url: registry.menlo.ai
      tags: registry.menlo.ai/jan-server/mcp-tools:dev-${{ github.sha }}
      is_push: ${{ github.event_name == 'push' }}
      build-args: |
        VERSION_TAG=dev-${{ github.sha }}
      build-contexts: |
        go-common=packages/go-common

  build-media-api:
    needs: changes
    if: needs.changes.outputs.media-api == 'true' || needs.changes.outputs.pkg == 'true' || needs.changes.outputs.go-common == 'true'
    uses: ./.github/workflows/_reusable-docker.yml
    secrets: inherit
    with:
      runs-on: ubuntu-24-04-docker
      docker-file: services/media-api/Dockerfile
      context: services/media-api
      registry-url: registry.menlo.ai
      tags: registry.menlo.ai/jan-server/media-api:dev-${{ github.sha }}
      is_push: ${{ github.event_name == 'push' }}
      build-args: |
        VERSION_TAG=dev-${{ github.sha }}
      build-contexts: |
        go-common=packages/go-common

  build-response-api:
    needs: changes
    if: needs.changes.outputs.response-api == 'true' || needs.changes.outputs.pkg == 'true' || needs.changes.outputs.go-common == 'true'
    uses: ./.github/workflows/_reusable-docker.yml
    secrets: inherit
    with:
      runs-on: ubuntu-24-04-docker
      docker-file: services/response-api/Dockerfile
      context: services/response-api
      registry-url: registry.menlo.ai
      tags: registry.menlo.ai/jan-server/response-api:dev-${{ github.sha }}
      is_push: ${{ github.event_name == 'push' }}
      build-args: |
        VERSION_TAG=dev-${{ github.sha }}
      build-contexts: |
        go-common=packages/go-common
