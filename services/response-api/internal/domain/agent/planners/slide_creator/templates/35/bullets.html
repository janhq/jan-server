{{define "body"}}
<section style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
  <div style="font-size:14px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:{{.Theme.AccentColor}};">Highlights</div>
  <h1 style="margin:14px 0 0 0; font-size:64px; line-height:1.04; font-weight:950; letter-spacing:-0.02em; color:{{.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Slide.Title 90}}</h1>
  {{if .Bullets.Subtitle}}<p style="margin:16px 0 0 0; font-size:26px; line-height:1.28; font-weight:650; color:{{.Muted}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Bullets.Subtitle 150}}</p>{{end}}

  <div style="margin-top:22px; flex:1; overflow:hidden;">
    <ul style="margin:0; padding:0; list-style:none; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 22px; overflow:hidden;">
      {{range .Bullets.Bullets}}
      <li style="min-width:0; border-left:4px solid {{$.Theme.AccentColor}}; padding:10px 0 10px 14px;">
        <div style="font-size:{{$.Bullets.ItemFont}}px; line-height:1.3; font-weight:700; color:{{$.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes . 180}}</div>
      </li>
      {{end}}
    </ul>
  </div>
</section>
{{end}}
