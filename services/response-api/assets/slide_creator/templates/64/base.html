<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#000;">
<div style="width:100vw; aspect-ratio:16 / 9; max-width:{{.SlideW}}px; margin:0; background:{{.Background}}; color:{{.Theme.TextColor}}; font-family:{{.Theme.FontFamily}}; display:flex; flex-direction:column; box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; top:0; left:0; right:0; height:148px; background:linear-gradient(90deg, {{withAlpha .Theme.AccentColor 0.22}} 0%, rgba(0,0,0,0) 70%); pointer-events:none;"></div>

  <header style="height:96px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; position:relative; z-index:1;">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <div style="width:28px; height:6px; border-radius:999px; background:{{.Theme.AccentColor}};"></div>
      <div style="font-size:22px; font-weight:900; letter-spacing:0.2px; color:{{.Theme.TextColor}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:980px;">{{.Plan.Title}}</div>
    </div>
    <div style="font-size:14px; font-weight:850; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Slide.Title}}</div>
  </header>

  <main style="flex:1; padding:58px 96px; box-sizing:border-box; overflow:hidden;">
    <div style="height:100%; border:1px solid {{.CardBorder}}; border-radius:34px; background:{{.CardBg}}; box-shadow:0 30px 82px {{.Shadow}}; padding:54px 58px; box-sizing:border-box; overflow:hidden; position:relative;">
      <div style="position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg, {{.Theme.AccentColor}} 0%, rgba(0,0,0,0) 80%);"></div>
      {{template "body" .}}
    </div>
  </main>

  <footer style="height:64px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-top:1px solid {{.Line}};">
    <div style="font-size:14px; font-weight:800; color:{{.Muted}};">{{.Index}} / {{.Total}}</div>
    <div style="font-size:14px; font-weight:800; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Plan.Title}}</div>
  </footer>
</div>
</body>
</html>
