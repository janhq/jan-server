<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#000;">
<div style="width:100vw; aspect-ratio:16 / 9; max-width:{{.SlideW}}px; margin:0; background:{{.Background}}; color:{{.Theme.TextColor}}; font-family:{{.Theme.FontFamily}}; display:flex; flex-direction:column; box-sizing:border-box; position:relative; overflow:hidden;">
  <header style="height:92px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-bottom:1px solid {{.Line}};">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <div style="width:12px; height:12px; border-radius:999px; background:{{.Theme.AccentColor}};"></div>
      <div style="font-size:22px; font-weight:900; letter-spacing:0.2px; color:{{.Theme.TextColor}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:980px;">{{.Plan.Title}}</div>
    </div>
    <div style="font-size:14px; font-weight:800; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Slide.Title}}</div>
  </header>

  <main style="flex:1; padding:64px 96px; box-sizing:border-box; overflow:hidden;">
    <div style="height:100%; border:1px solid {{.CardBorder}}; border-radius:30px; background:{{.CardBg}}; box-shadow:0 26px 76px {{.Shadow}}; padding:14px; box-sizing:border-box; overflow:hidden;">
      <div style="height:100%; border:1px solid {{.BodyBorder}}; border-radius:22px; background:rgba(0,0,0,0); padding:38px 42px; box-sizing:border-box; overflow:hidden;">
        {{template "body" .}}
      </div>
    </div>
  </main>

  <footer style="height:64px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-top:1px solid {{.Line}};">
    <div style="font-size:14px; font-weight:800; color:{{.Muted}};">Slide {{.Index}}/{{.Total}}</div>
    <div style="font-size:14px; font-weight:800; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Plan.Title}}</div>
  </footer>
</div>
</body>
</html>
