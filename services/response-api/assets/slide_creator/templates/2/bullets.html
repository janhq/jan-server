{{define "body"}}
<section style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; min-width:0;">
    <div style="min-width:0;">
      <div style="font-size:14px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:{{.Theme.AccentColor}};">Key takeaways</div>
      <h1 style="margin:14px 0 0 0; font-size:60px; line-height:1.06; font-weight:950; letter-spacing:-0.02em; color:{{.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Slide.Title 90}}</h1>
    </div>
    <div style="font-size:14px; font-weight:800; color:{{.Muted}}; background:{{withAlpha .Theme.TextColor 0.05}}; border:1px solid {{.BodyBorder}}; padding:10px 14px; border-radius:999px; white-space:nowrap;">{{len .Bullets.Bullets}} items</div>
  </div>
  {{if .Bullets.Subtitle}}<p style="margin:16px 0 0 0; font-size:26px; line-height:1.28; font-weight:650; color:{{.Muted}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Bullets.Subtitle 150}}</p>{{end}}

  <div style="margin-top:22px; flex:1; overflow:hidden;">
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 18px; height:100%; overflow:hidden;">
      {{range .Bullets.Bullets}}
      <div style="border:1px solid {{$.BodyBorder}}; background:{{withAlpha $.Theme.TextColor 0.03}}; border-radius:18px; padding:16px 18px; display:flex; gap:12px; align-items:flex-start; min-width:0; overflow:hidden;">
        <div style="margin-top:4px; width:28px; height:28px; border-radius:999px; background:{{withAlpha $.Theme.AccentColor 0.16}}; border:1px solid {{withAlpha $.Theme.AccentColor 0.32}}; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:{{$.Theme.AccentColor}}; flex:0 0 auto;">✓</div>
        <div style="font-size:{{$.Bullets.ItemFont}}px; line-height:1.3; font-weight:650; color:{{$.Theme.TextColor}}; min-width:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes . 170}}</div>
      </div>
      {{end}}
    </div>
  </div>
</section>
{{end}}
