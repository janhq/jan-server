{{define "body"}}
<section style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
  <div style="font-size:14px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:{{.Theme.AccentColor}};">Summary</div>
  <h1 style="margin:14px 0 0 0; font-size:62px; line-height:1.06; font-weight:950; letter-spacing:-0.02em; color:{{.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Slide.Title 90}}</h1>
  {{if .Bullets.Subtitle}}<p style="margin:16px 0 0 0; font-size:26px; line-height:1.28; font-weight:650; color:{{.Muted}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Bullets.Subtitle 150}}</p>{{end}}

  <div style="margin-top:24px; flex:1; overflow:hidden; display:grid; grid-template-columns:repeat(12, 1fr); gap:24px;">
    <div style="grid-column:1 / span 12; border-left:3px solid {{withAlpha .Theme.AccentColor 0.40}}; padding-left:22px; overflow:hidden;">
      <ul style="margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:18px; overflow:hidden;">
        {{range .Bullets.Bullets}}
        <li style="display:flex; gap:16px; align-items:flex-start;">
          <div style="margin-top:8px; width:12px; height:12px; border-radius:999px; background:{{$.Theme.AccentColor}}; box-shadow:0 0 0 4px {{withAlpha $.Theme.AccentColor 0.14}}; flex:0 0 auto;"></div>
          <div style="font-size:{{$.Bullets.ItemFont}}px; line-height:1.32; font-weight:650; color:{{$.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes . 150}}</div>
        </li>
        {{end}}
      </ul>
    </div>
  </div>
</section>
{{end}}
