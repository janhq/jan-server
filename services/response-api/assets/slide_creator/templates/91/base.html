<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#000;">
<div style="width:100vw; aspect-ratio:16 / 9; max-width:{{.SlideW}}px; margin:0; background:{{.Background}}; color:{{.Theme.TextColor}}; font-family:{{.Theme.FontFamily}}; display:flex; flex-direction:column; box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; top:-280px; right:-260px; width:820px; height:820px; border-radius:999px; background:radial-gradient(circle at 30% 30%, {{.AccGlow}} 0%, rgba(0,0,0,0) 68%); filter:blur(0px); pointer-events:none; z-index:0;"></div>
  <div style="position:absolute; bottom:-320px; left:-220px; width:880px; height:880px; border-radius:999px; background:radial-gradient(circle at 40% 45%, {{.PriGlow}} 0%, rgba(0,0,0,0) 72%); filter:blur(0px); pointer-events:none; z-index:0;"></div>

  <header style="height:92px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-bottom:1px solid {{.Line}}; position:relative; z-index:2;">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <div style="width:12px; height:12px; border-radius:999px; background:{{.Theme.AccentColor}}; flex:0 0 auto;"></div>
      <div style="font-size:22px; font-weight:800; letter-spacing:0.2px; color:{{.Theme.TextColor}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:980px;">{{.Plan.Title}}</div>
    </div>
    <div style="font-size:14px; font-weight:700; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Slide.Title}}</div>
  </header>

  <main style="flex:1; padding:64px 96px; box-sizing:border-box; position:relative; z-index:2; overflow:hidden;">
    <div style="height:100%; border:1px solid {{.CardBorder}}; border-radius:32px; background:{{.CardBg}}; box-shadow:0 30px 80px {{.Shadow}}; padding:52px 56px; box-sizing:border-box; overflow:hidden;">
      {{template "body" .}}
    </div>
  </main>

  <footer style="height:64px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-top:1px solid {{.Line}}; position:relative; z-index:2;">
    <div style="font-size:14px; font-weight:700; color:{{.Muted}};">Slide {{.Index}}/{{.Total}}</div>
    <div style="font-size:14px; font-weight:700; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Plan.Title}}</div>
  </footer>
</div>
</body>
</html>
