{{define "body"}}
<section style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
  <div style="font-size:14px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:{{.Theme.AccentColor}};">Overview</div>
  <h1 style="margin:14px 0 0 0; font-size:64px; line-height:1.05; font-weight:900; letter-spacing:-0.02em; color:{{.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Slide.Title 90}}</h1>
  {{if .Bullets.Subtitle}}<p style="margin:16px 0 0 0; font-size:28px; line-height:1.28; font-weight:650; color:{{.Muted}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Bullets.Subtitle 140}}</p>{{end}}

  <div style="margin-top:{{if .Bullets.Subtitle}}26px{{else}}18px{{end}}; flex:1; border-top:1px solid {{.BodyBorder}}; padding-top:22px; overflow:hidden;">
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px 44px; height:100%; overflow:hidden;">
      {{range .Bullets.Bullets}}
      <div style="display:flex; gap:16px; align-items:flex-start; padding:8px 0; min-width:0;">
        <div style="margin-top:10px; width:10px; height:10px; border-radius:999px; background:{{$.Theme.AccentColor}}; flex:0 0 auto;"></div>
        <div style="font-size:{{$.Bullets.ItemFont}}px; line-height:1.3; font-weight:650; color:{{$.Theme.TextColor}}; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes . 140}}</div>
      </div>
      {{end}}
    </div>
  </div>
</section>
{{end}}
