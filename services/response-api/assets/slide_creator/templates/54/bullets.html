{{define "body"}}
<section style="height:100%; display:flex; flex-direction:column; overflow:hidden;">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; min-width:0;">
    <div style="min-width:0;">
      <div style="font-size:14px; font-weight:900; letter-spacing:0.18em; text-transform:uppercase; color:{{.Theme.AccentColor}};">Points</div>
      <h1 style="margin:14px 0 0 0; font-size:62px; line-height:1.06; font-weight:950; letter-spacing:-0.02em; color:{{.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Slide.Title 90}}</h1>
    </div>
    <div style="font-size:13px; font-weight:850; color:{{.Muted}};">Slide {{.Index}}/{{.Total}}</div>
  </div>
  {{if .Bullets.Subtitle}}<p style="margin:16px 0 0 0; font-size:26px; line-height:1.28; font-weight:650; color:{{.Muted}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes .Bullets.Subtitle 150}}</p>{{end}}

  <div style="margin-top:22px; flex:1; overflow:hidden;">
    <div style="display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start; height:100%; overflow:hidden;">
      {{range .Bullets.Bullets}}
      <div style="max-width:100%; border:1px solid {{$.BodyBorder}}; background:{{withAlpha $.Theme.TextColor 0.03}}; border-radius:999px; padding:12px 16px; display:flex; gap:10px; align-items:flex-start;">
        <div style="width:10px; height:10px; border-radius:999px; background:{{$.Theme.AccentColor}}; margin-top:8px;"></div>
        <div style="font-size:{{$.Bullets.ItemFont}}px; line-height:1.25; font-weight:650; color:{{$.Theme.TextColor}}; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{trimToRunes . 140}}</div>
      </div>
      {{end}}
    </div>
  </div>
</section>
{{end}}
