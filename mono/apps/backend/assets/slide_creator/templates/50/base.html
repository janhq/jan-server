<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#000;">
<div style="width:100vw; aspect-ratio:16 / 9; max-width:{{.SlideW}}px; margin:0; background:{{.Background}}; color:{{.Theme.TextColor}}; font-family:{{.Theme.FontFamily}}; display:flex; flex-direction:column; box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; top:0; left:0; bottom:0; width:18px; background:linear-gradient(180deg, {{.Theme.AccentColor}} 0%, {{withAlpha .Theme.AccentColor 0.25}} 45%, rgba(0,0,0,0) 100%); opacity:0.95;"></div>
  <header style="height:90px; padding:0 92px 0 110px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-bottom:1px solid {{.Line}}; position:relative;">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <div style="font-size:20px; font-weight:900; letter-spacing:0.3px; color:{{.Theme.TextColor}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:980px;">{{.Plan.Title}}</div>
    </div>
    <div style="font-size:13px; font-weight:800; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Slide.Title}}</div>
  </header>

  <main style="flex:1; padding:60px 92px 60px 110px; box-sizing:border-box; overflow:hidden;">
    <div style="height:100%; border:1px solid {{.CardBorder}}; border-radius:30px; background:{{.CardBg}}; box-shadow:0 26px 70px {{.Shadow}}; padding:52px 54px; box-sizing:border-box; overflow:hidden;">
      {{template "body" .}}
    </div>
  </main>

  <footer style="height:62px; padding:0 92px 0 110px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-top:1px solid {{.Line}};">
    <div style="font-size:13px; font-weight:800; color:{{.Muted}};">Slide {{.Index}}/{{.Total}}</div>
    <div style="font-size:13px; font-weight:800; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Plan.Title}}</div>
  </footer>
</div>
</body>
</html>
