<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0; padding:0; background:#000;">
<div style="width:100vw; aspect-ratio:16 / 9; max-width:{{.SlideW}}px; margin:0; background:{{.Background}}; color:{{.Theme.TextColor}}; font-family:{{.Theme.FontFamily}}; display:flex; flex-direction:column; box-sizing:border-box; position:relative; overflow:hidden;">
  <div style="position:absolute; inset:0; background:radial-gradient(circle at 14px 14px, {{withAlpha .Theme.TextColor 0.06}} 2px, rgba(0,0,0,0) 2.5px); background-size:28px 28px; pointer-events:none;"></div>
  <div style="position:absolute; top:-220px; right:-260px; width:720px; height:720px; border-radius:999px; background:radial-gradient(circle at 30% 30%, {{withAlpha .Theme.AccentColor 0.24}} 0%, rgba(0,0,0,0) 70%); pointer-events:none;"></div>

  <header style="height:92px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; position:relative; z-index:1;">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <div style="width:12px; height:12px; border-radius:4px; background:{{.Theme.AccentColor}};"></div>
      <div style="font-size:22px; font-weight:950; letter-spacing:0.2px; color:{{.Theme.TextColor}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:980px;">{{.Plan.Title}}</div>
    </div>
    <div style="font-size:14px; font-weight:850; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Slide.Title}}</div>
  </header>

  <main style="flex:1; padding:62px 96px; box-sizing:border-box; overflow:hidden; position:relative; z-index:1;">
    <div style="height:100%; border:1px dashed {{.CardBorder}}; border-radius:34px; background:{{.CardBg}}; box-shadow:0 28px 76px {{.Shadow}}; padding:52px 56px; box-sizing:border-box; overflow:hidden;">
      {{template "body" .}}
    </div>
  </main>

  <footer style="height:64px; padding:0 96px; display:flex; align-items:center; justify-content:space-between; box-sizing:border-box; border-top:1px solid {{.Line}}; position:relative; z-index:1;">
    <div style="font-size:14px; font-weight:850; color:{{.Muted}};">Slide {{.Index}}/{{.Total}}</div>
    <div style="font-size:14px; font-weight:850; color:{{.Muted}}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:760px;">{{.Plan.Title}}</div>
  </footer>
</div>
</body>
</html>
