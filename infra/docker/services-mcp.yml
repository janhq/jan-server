  #   profiles: ["mcp", "full"]

  # Lightweight vector store for MCP file search
  vector-store:
    build: ../../services/mcp-tools/tools/vector-store-service
    restart: unless-stopped
    environment:
      VECTOR_STORE_PORT: ${VECTOR_STORE_PORT:-3015}
    ports:
      - "${VECTOR_STORE_PORT:-3015}:3015"
    networks:
      - mcp-network
    # Distroless image - no healthcheck tools available
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:3015/health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    profiles: ["vector", "full"]

  # SandboxFusion code interpreter
  # sandboxfusion:
  #   image: volcengine/sandbox-fusion:server-20250609
  #   restart: unless-stopped
  #   ports:
  #     - "${SANDBOXFUSION_PORT:-3010}:8080"
  #   networks:
  #     - mcp-network
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   profiles: ["mcp", "full"]

  # MCP Tools API - Unified MCP interface
  mcp-tools:
    build:
      context: ../../services/mcp-tools
      additional_contexts:
        go-common: ../../packages/go-common
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../../.env}
    environment:
      # HTTP Server (service-specific port)
      MCP_TOOLS_HTTP_PORT: ${MCP_TOOLS_HTTP_PORT:-8091}
      
      # Search Configuration
      MCP_SEARCH_ENGINE: ${MCP_SEARCH_ENGINE:-serper}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      
      # Circuit Breaker Configuration
      SERPER_CB_FAILURE_THRESHOLD: ${SERPER_CB_FAILURE_THRESHOLD:-10}
      SERPER_CB_SUCCESS_THRESHOLD: ${SERPER_CB_SUCCESS_THRESHOLD:-3}
      SERPER_CB_TIMEOUT: ${SERPER_CB_TIMEOUT:-60}
      SERPER_CB_MAX_HALF_OPEN: ${SERPER_CB_MAX_HALF_OPEN:-3}
      
      # Logging
      MCP_TOOLS_LOG_LEVEL: ${MCP_TOOLS_LOG_LEVEL:-info}
      MCP_TOOLS_LOG_FORMAT: ${MCP_TOOLS_LOG_FORMAT:-json}
      
      # MCP Provider endpoints (internal Docker network)
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      VECTOR_STORE_URL: ${VECTOR_STORE_URL:-http://vector-store:3015}
      SANDBOXFUSION_URL: ${SANDBOXFUSION_URL:-http://sandboxfusion:8080}
      MEMORY_TOOLS_URL: ${MEMORY_TOOLS_URL:-http://memory-tools:8090}

      # LLM-API for tool tracking and dynamic descriptions
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://llm-api:8080}
      MCP_TRACKING_ENABLED: ${MCP_TRACKING_ENABLED:-true}

      # Optional tool toggles
      MCP_ENABLE_MEMORY_RETRIEVE: ${MCP_ENABLE_MEMORY_RETRIEVE:-true}
      
      # MCP Configuration
      MCP_CONFIG_FILE: ${MCP_CONFIG_FILE:-configs/mcp-providers.yml}
      MCP_SANDBOX_REQUIRE_APPROVAL: ${MCP_SANDBOX_REQUIRE_APPROVAL:-true}
      
      # Sandbox Provider Configuration (mutually exclusive: "aio", "e2b", or empty)
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-}

      # AIO Sandbox Configuration (when SANDBOX_PROVIDER=aio)
      AIO_ENABLED: ${AIO_ENABLED:-false}
      AIO_URL: ${AIO_URL:-http://aio-sandbox:8080}
      AIO_TIMEOUT: ${AIO_TIMEOUT:-120s}

      # E2B Sandbox Configuration (when SANDBOX_PROVIDER=e2b)
      E2B_SERVICE_URL: ${E2B_SERVICE_URL:-http://e2b-service:8095}
      E2B_TIMEOUT: ${E2B_TIMEOUT:-120s}

      # Authentication
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
    ports:
      - "${MCP_TOOLS_HTTP_PORT:-8091}:${MCP_TOOLS_HTTP_PORT:-8091}"
    # depends_on:
    #   # searxng:
    #   #   condition: service_healthy
    #   # Vector store is optional (profile: vector)
    #   # vector-store:
    #   #   condition: service_started
    #   # memory-tools is optional - only needed when memory profile is enabled
    #   # memory-tools:
    #   #   condition: service_started
    #   # sandboxfusion:
    #   #   condition: service_started
    volumes:
      - ../../services/mcp-tools/configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${MCP_TOOLS_HTTP_PORT:-8091}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - mcp-network
    profiles: ["mcp", "full"]

  # AIO Sandbox - All-in-One Agent Sandbox Environment
  # Provides: Browser automation, File operations, Shell/Terminal, Code execution, Jupyter
  # Docs: https://sandbox.agent-infra.com/
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: aio-sandbox
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    ports:
      - "${AIO_HOST_PORT:-8180}:8080"
    environment:
      WORKSPACE: ${AIO_WORKSPACE:-/home/gem}
      TZ: ${TZ:-UTC}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      PROXY_SERVER: ${AIO_PROXY_SERVER:-}
      HOMEPAGE: ${AIO_HOMEPAGE:-}
      BROWSER_EXTRA_ARGS: ${AIO_BROWSER_EXTRA_ARGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Note: Volume mount removed to avoid permission issues on Windows/Mac
    # For persistent workspace, use a bind mount with correct permissions:
    #   - ./aio-data:/home/gem:rw
    # volumes:
    #   - aio-workspace:/home/gem
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
    profiles: ["aio", "full"]

  # E2B Service - Python service for E2B Cloud sandbox management
  # Provides browser automation, desktop interaction, and code execution via E2B Cloud
  e2b-service:
    build: ../../services/mcp-tools/tools/e2b-service
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../../.env}
    environment:
      # E2B Cloud Configuration
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_ACCESS_TOKEN: ${E2B_ACCESS_TOKEN:-}
      E2B_TEMPLATE_ID: ${E2B_TEMPLATE_ID:-jan-browser-sandbox}
      E2B_SERVICE_PORT: 8095
      E2B_SANDBOX_TIMEOUT: ${E2B_SANDBOX_TIMEOUT:-1800}
      # Database Configuration (dedicated E2B database)
      # Clear global DSN to use E2B-specific DB settings
      DB_POSTGRESQL_WRITE_DSN: ""
      DB_HOST: ${E2B_DB_HOST:-api-db}
      DB_PORT: ${E2B_DB_PORT:-5432}
      DB_USER: ${E2B_DB_USER:-sandbox}
      DB_PASSWORD: ${E2B_DB_PASSWORD:-sandbox}
      DB_NAME: ${E2B_DB_NAME:-e2b_sandbox}
      AUTO_MIGRATE: "true"
      LOG_LEVEL: ${E2B_LOG_LEVEL:-INFO}
    depends_on:
      api-db:
        condition: service_healthy
    networks:
      - mcp-network
      - default
    ports:
      - "${E2B_SERVICE_PORT:-8095}:8095"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["e2b"]

volumes:
  aio-workspace:
    driver: local

# Note: Networks are defined in infrastructure.yml and shared across all compose files
